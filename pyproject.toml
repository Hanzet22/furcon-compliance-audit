[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "furcon-compliance-audit"
version = "2.0.0"
description = "Platform-neutral preliminary convention policy review core"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
furcon-audit = "furcon_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
